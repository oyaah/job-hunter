[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "job-hunter-mcp"
version = "0.4.2"
description = "outreach-mcp server for the job-hunter plugin: contact enrichment, a deterministic anti-AI voice lint, gated cross-platform email send (SMTP / local mail client / Gmail OAuth), and an honest cross-session LinkedIn rate guard."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "oyaah" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
]

[project.urls]
Homepage = "https://github.com/oyaah/job-hunter"
Repository = "https://github.com/oyaah/job-hunter"

# Console entry so the server launches via `uvx job-hunter-mcp` / `pip install`.
# The server modules live in the flat `servers/outreach-mcp/` tree (which is also
# what the Claude Code / Codex plugin runs directly). The `sources` remap below
# rewrites that path to an importable `outreach_mcp` package inside the built
# wheel — server.py bootstraps its own dir onto sys.path, so the existing absolute
# imports keep working in both the plugin (script) and the installed wheel.
[project.scripts]
job-hunter-mcp = "outreach_mcp.server:main"

[tool.hatch.build.targets.wheel]
only-include = ["servers/outreach-mcp"]

[tool.hatch.build.targets.wheel.sources]
"servers/outreach-mcp" = "outreach_mcp"

[tool.hatch.build.targets.sdist]
include = ["servers", "skills", "agents", "references", "hooks", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
